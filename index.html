*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:18px;margin:4px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
button,select{font:inherit;color:var(--fg);background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
.tabs button{flex:1}
.on{background:var(--ac)!important;color:var(--bg)!important;border-color:var(--ac)!important}

ul{padding-left:18px;margin:0}li{margin:5px 0}
b{color:var(--ac)}

.card.back{border-color:var(--ac)}
.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1}
.mu{color:var(--mu);font-size:14px;margin:6px 0}
.q{font-size:18px;margin:10px 0}
.opt{display:block;width:100%;text-align:left;margin:7px 0}
.right{border-color:var(--ok)!important;color:var(--ok)}.wrong{border-color:var(--no)!important;color:var(--no)}
.note{background:var(--sf);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}

"동방 무정부주의자 연맹의 특징: {에스페란토} 사용",
"에스페란토: 1887년 폴란드의 {자멘호프} 박사가 만든 세계어",
"일본 반제 동맹: 일본 제국주의 타도 목표, 한국인과 일본인의 {공동} 투쟁 강조",
"반전을 위한 항일 연대의 배경: {만주 사변}(1931) 이후",
"만주 사변 후 {한중 민족 항일 대동맹} 결성: 대한민국 임시 정부와 중국 국민당 인사들의 비밀 결사",
"조선 의용대: {김원봉}이 조직, 중국 국민당군과 공동 항일",
"한국광복군: {대한민국 임시 정부}가 창설, 중국 국민 정부 지원으로 연합국 일원으로 대일전 참전",
"일본 인민 반전 동맹: {가지 와타루}가 결성, 일본인 포로와 중국 거류민에게 반전 교육",
"타이완 의용대: {리요우방}이 결성, 조선 의용대와 연대(중국 남부 활동)",
"동남아시아 반식민 운동 배경: 1920년대 이후 {공산당}이 정치 세력으로 성장, 민족주의적 성격 강함",
"베트남 공산당(1930): {호찌민}이 주도, 프랑스령 인도차이나 전체의 해방 목표",
"말라야 공산당(1930): {싱가포르}에서 결성, 말라야인 결집·반제국주의 투쟁",
"{타킨당}(우리 버마인 연맹, 1930): 버마 급진적 민족주의자들이 결성, 영국으로부터 완전한 독립 추구",
"타킨당이 배출한 버마 독립 운동 지도자: {아웅 산}",
"1976년 베트남 통일 후 사이공은 {호찌민}시로 개칭"]]];
const C=[];D.forEach((u,i)=>u[1].forEach(t=>{const m=t.match(/\{(.+?)\}/);if(m)C.push({u:i,t:t,a:m[1],q:t.replace(/\{.+?\}/,"＿＿＿").replace(/[{}]/g,"")})}));
const $=id=>document.getElementById(id);
let tab=0,U=-1,hide=false,fl={},qz={};
const hl=t=>t.replace(/\{(.+?)\}/g,(m,a)=>hide?'<b class="h" onclick="this.classList.toggle(\'s\')">'+a+'</b>':'<b>'+a+'</b>');
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=()=>C.filter(c=>U<0||c.u==U);
function init(){
$("tabs").innerHTML=["요약","카드","퀴즈"].map((n,i)=>'<button class="'+(i==tab?"on":"")+'" onclick="tab='+i+';reset()">'+n+'</button>').join("");
$("unit").innerHTML='<option value="-1">전체 ('+C.length+'개)</option>'+D.map((u,i)=>'<option value="'+i+'"'+(U==i?" selected":"")+'>'+u[0]+'</option>').join("");
$("unit").onchange=e=>{U=+e.target.value;reset()};
const x=$("x");x.style.display=tab==1?"none":"";
x.textContent=tab==0?(hide?"답 보기":"답 가리기"):"새로 시작";
x.onclick=()=>{if(tab==0){hide=!hide;draw()}else reset()};
}
function reset(){fl={d:sh(pool()),i:0,k:0};qz={d:sh(pool()),i:0,s:0,w:[],a:false};init();draw()}
function draw(){[sum,flash,quiz][tab]()}
function sum(){
$("v").innerHTML=D.map((u,i)=>(U<0||U==i)?'<h3>'+u[0]+'</h3><ul>'+u[1].map(t=>'<li>'+hl(t)+'</li>').join("")+'</ul>':"").join("")+(hide?'<p class="mu">가려진 답을 눌러 확인하세요.</p>':"");
}
function flash(){
if(fl.i>=fl.d.length){const n=fl.d.length-fl.k;$("v").innerHTML='<div class="card">한 바퀴 완료!<br>외움 '+fl.k+' / 다시 볼 카드 '+n+'</div><div class="row">'+(fl.w&&fl.w.length?'<button class="on" onclick="fl.d=sh(fl.w);fl.w=[];fl.i=0;fl.k=0;flash()">헷갈린 카드만 복습</button>':'')+'<button onclick="reset()">처음부터</button></div>';return}
const c=fl.d[fl.i];fl.b=false;
$("v").innerHTML='<p class="mu">'+(fl.i+1)+' / '+fl.d.length+' · '+D[c.u][0]+'</p><div class="card" id="cd">'+c.q+'</div><p class="mu">카드를 눌러 정답 확인</p><div class="row"><button onclick="mark(0)">헷갈려요</button><button class="on" onclick="mark(1)">외웠어요</button></div>';
$("cd").onclick=()=>{fl.b=!fl.b;$("cd").className="card"+(fl.b?" back":"");$("cd").innerHTML=fl.b?hl(c.t):c.q};
}
function mark(k){const c=fl.d[fl.i];if(k)fl.k++;else(fl.w=fl.w||[]).push(c);fl.i++;flash()}
function quiz(){
if(qz.i>=qz.d.length){$("v").innerHTML='<div class="card">점수 '+qz.s+' / '+qz.d.length+'</div><div class="row">'+(qz.w.length?'<button class="on" onclick="qz={d:sh(qz.w),i:0,s:0,w:[],a:false};quiz()">틀린 문제 다시</button>':'')+'<button onclick="reset()">새로 시작</button></div>'+(qz.w.length?'<h3>틀린 문제</h3><ul>'+qz.w.map(c=>'<li>'+hl(c.t)+'</li>').join("")+'</ul>':"");return}
const c=qz.d[qz.i];let ds=sh([...new Set(C.filter(x=>x.u==c.u&&x.a!=c.a).map(x=>x.a))]).slice(0,3);
if(ds.length<3)ds=ds.concat(sh([...new Set(C.map(x=>x.a))].filter(a=>a!=c.a&&!ds.includes(a))).slice(0,3-ds.length));
const o=sh(ds.concat(c.a));qz.a=false;
$("v").innerHTML='<p class="mu">'+(qz.i+1)+' / '+qz.d.length+' · 점수 '+qz.s+'</p><div class="q">'+c.q+'</div>'+o.map((a,j)=>'<button class="opt" id="o'+j+'">'+a+'</button>').join("")+'<div id="fb"></div>';
o.forEach((a,j)=>$("o"+j).onclick=()=>{if(qz.a)return;qz.a=true;const ok=a==c.a;
if(ok)qz.s++;else qz.w.push(c);
o.forEach((b,k)=>{if(b==c.a)$("o"+k).classList.add("right")});if(!ok)$("o"+j).classList.add("wrong");
$("fb").innerHTML='<div class="note">'+(ok?"정답! ":"오답. ")+hl(c.t)+'</div><div class="row"><button class="on" onclick="qz.i++;quiz()">다음</button></div>'});
}
reset();
</script></body></html>
